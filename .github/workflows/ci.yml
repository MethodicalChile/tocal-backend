name: Backend CI (Django + RBAC + Documentos)

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-test-secret-key-only-not-for-production-use-1234567890"
      STORAGE_BACKEND: "local"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated test suite (isolated SQLite memory DB)
        run: python manage.py test -v 2
